const GKEYS = Object.keys(GLYPHS);
const GIDX = {}; GKEYS.forEach((k, i) => GIDX[k] = i);
const fontCache = {};

const ACC = { 'Á':'A','É':'E','Í':'I','Ó':'O','Ú':'U','Ü':'U' };
function norm(s) { return String(s).toUpperCase().replace(/[ÁÉÍÓÚÜ]/g, m => ACC[m]); }
function textW(s, sc = 1) { return norm(s).length * 6 * sc - sc; }

// ---------- 3. Generador de sprites (pixel art por poses) ----------
// Cada personaje se dibuja como un esqueleto con cápsulas sombreadas en 3 tonos,
// contorno de 1 px y paleta de 16 colores (índice 0 = transparente).
// Si existe sprites/<nombre>.png con la misma rejilla, sustituye al generado (ver SPRITES.md).
const MAT = { skin:[2,3,4], cloth:[5,6,7], acc:[8,9,10], metal:[11,12,13], hair:[1,14,15], boot:[1,11,12], dark:[1,5,6] };

  torsoG.push(cap(headC, headC, D.head, M(mt.head)));
  G.push(torsoG);
  G.push([cap(legF[0], legF[1], D.rTh, M(mt.thigh)), cap(legF[1], legF[2], D.rSh, M(mt.shin)), cap(legF[2], footF, D.rFoot, M(mt.foot))]);

const SETS = {};

// --- definiciones de personajes ---
const D_NINJA = { torso:12, neck:1.2, head:4.4, thigh:9, shin:9.5, foot:3.5, ua:6.5, fa:6.5, rT0:3.6, rT1:4.6, rTh:2.7, rSh:2.2, rUA:2.0, rFA:1.8, rHand:1.7, rFoot:1.5, sword:17 };
