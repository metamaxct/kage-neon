// PIXEL: píxeles nítidos · ARCADE: monitor de recreativa (scanlines y máscara suaves)
// TV: televisor doméstico por RF/compuesto (desenfoque horizontal, haz que se ensancha
// con el brillo, rejilla RGB, halo, curvatura y viñeta).
const CRT = { gl:null, prog:null, tex:null, u:{}, ctx2d:null };

// ---------- 11. Bucle principal y estados ----------
function step() {
  pollInput(); FRAME++; ST++;
  if (STATE === 'boot') { STATE = 'title'; ST = 0; }
  if (STATE === 'title') {
    if (IN.upP) { MENU = (MENU + 4) % 5; sfx('select'); } if (IN.downP) { MENU = (MENU + 1) % 5; sfx('select'); }
    const act = IN.startP || IN.atkP || IN.jumpP, lr = IN.leftP || IN.rightP, d = IN.leftP ? -1 : 1;
    if (MENU === 0 && act) { auResume(); sfx('start'); newGame(OPT.level); STATE = 'card'; ST = 0; }
    else if (MENU === 1 && (act || lr)) { OPT.level = (OPT.level + d + LEVELS.length) % LEVELS.length; sfx('select'); ensureSets(['rojo']); setupLevel(OPT.level); }
    else if (MENU === 2 && (act || lr)) { OPT.arcade = !OPT.arcade; sfx('select'); }
    else if (MENU === 3 && (act || lr)) { OPT.crt = (OPT.crt + (IN.leftP ? 2 : 1)) % 3; sfx('select'); saveOpt(); }
    else if (MENU === 4 && (act || lr)) { AU.musicOn = !AU.musicOn; sfx('select'); }
  } else if (STATE === 'card') {
    if (ST > 170 || (ST > 30 && (IN.startP || IN.atkP))) { STATE = 'play'; ST = 0; musicStart(LV.song); }
  } else if (STATE === 'play') {
    if (IN.startP) { STATE = 'pause'; PMENU = 0; if (AU.ctx) AU.ctx.suspend(); return; }
    updWorld();
    if (G.score > HISCORE) HISCORE = G.score;
  } else if (STATE === 'pause') {
    if (IN.upP) { PMENU = (PMENU + 2) % 3; } if (IN.downP) { PMENU = (PMENU + 1) % 3; }
    const sel = IN.startP || IN.atkP || IN.jumpP;
    if (sel && PMENU === 0) { STATE = 'play'; if (AU.ctx) AU.ctx.resume(); }
    else if ((sel || IN.leftP || IN.rightP) && PMENU === 1) { AU.musicOn = !AU.musicOn; }
    else if (sel && PMENU === 2) { if (AU.ctx) AU.ctx.resume(); musicStop(); saveHi(); STATE = 'title'; ST = 0; MENU = 0; setupLevel(OPT.level); }
  } else if (STATE === 'clear') {
    if (ST === 40) G.score += G.tally.time; if (ST === 70) G.score += G.tally.magic; if (ST === 100) G.score += G.tally.boss;
    if (ST > 180 && (IN.startP || IN.atkP)) {
      if (G.level < LEVELS.length - 1) { startLevel(G.level + 1); STATE = 'card'; ST = 0; }
      else { STATE = 'ending'; ST = 0; saveHi(); }
    }
  } else if (STATE === 'ending') {
    if (ST > 400 && (IN.startP || IN.atkP)) { STATE = 'title'; ST = 0; MENU = 0; setupLevel(OPT.level); }
  } else if (STATE === 'gameover') {
