function fit() {

  const s = Math.min(innerWidth / W, availH / H), si = s >= 2 ? Math.floor(s) : s;
  const cw = Math.round(W * si), ch = Math.round(H * si), dpr = Math.min(2, window.devicePixelRatio || 1);

// ---------- 11. Bucle principal y estados ----------
function step() {
  pollInput(); FRAME++; ST++;
  if (STATE === 'boot') { STATE = 'title'; ST = 0; }
  if (STATE === 'title') {
    if (IN.upP) { MENU = (MENU + 3) % 4; sfx('select'); } if (IN.downP) { MENU = (MENU + 1) % 4; sfx('select'); }
    const act = IN.startP || IN.atkP || IN.jumpP, lr = IN.leftP || IN.rightP;
    if (MENU === 0 && act) { auResume(); sfx('start'); newGame(); STATE = 'card'; ST = 0; }
    else if (MENU === 1 && (act || lr)) { OPT.arcade = !OPT.arcade; sfx('select'); }
    else if (MENU === 2 && (act || lr)) { OPT.crt = (OPT.crt + (IN.leftP ? 2 : 1)) % 3; sfx('select'); saveOpt(); }
    else if (MENU === 3 && (act || lr)) { AU.musicOn = !AU.musicOn; sfx('select'); }
  } else if (STATE === 'card') {
    if (ST > 170 || (ST > 30 && (IN.startP || IN.atkP))) { STATE = 'play'; ST = 0; musicStart(); }
  } else if (STATE === 'play') {
    if (IN.startP) { STATE = 'pause'; if (AU.ctx) AU.ctx.suspend(); return; }
    updWorld();
    if (G.score > HISCORE) HISCORE = G.score;
  } else if (STATE === 'pause') {
    if (IN.startP) { STATE = 'play'; if (AU.ctx) AU.ctx.resume(); }
  } else if (STATE === 'clear') {
    if (ST === 40) G.score += G.tally.time; if (ST === 70) G.score += G.tally.magic;
    if (ST > 200 && (IN.startP || IN.atkP)) { saveHi(); STATE = 'title'; ST = 0; MENU = 0; }
  } else if (STATE === 'gameover') {
    if (IN.startP || IN.atkP) { G.lives = 3; G.score = 0; G.cont++; STATE = 'play'; spawnPlayer(G.cp); G.time = Math.max(G.time, 90 * 60); musicStart(); }
    else if (ST > 600) { saveHi(); STATE = 'title'; ST = 0; }
  }
}
function saveHi() { try { localStorage.setItem('kage.hi', String(HISCORE)); } catch (e) {} }
function saveOpt() { try { localStorage.setItem('kage.crt', String(OPT.crt)); } catch (e) {} }
try { const v = localStorage.getItem('kage.crt'); if (v !== null) OPT.crt = clamp(+v, 0, 2); } catch (e) {}
function render() {
  if (STATE === 'title' || STATE === 'boot') drawTitle();
  else if (STATE === 'card') drawCard();
  else { drawWorld(); drawHUD(); if (STATE === 'pause') { gx.fillStyle = 'rgba(0,0,0,.5)'; gx.fillRect(0, 0, W, H); text(gx, 'PAUSA', W / 2, 100, '#ffffff', { align:'center', scale:2 }); text(gx, 'M: MUSICA   V: PANTALLA', W / 2, 130, '#a8b0cc', { align:'center' }); }
    if (STATE === 'clear') drawTally(); if (STATE === 'gameover') drawGameOver(); }
  present();
}
let last = 0, acc = 0;
function loop(ts) {
  const dt = Math.min(0.1, (ts - last) / 1000 || 0); last = ts; acc += dt;
  let n = 0; while (acc >= 1 / 60 && n < 5) { step(); acc -= 1 / 60; n++; }
  render(); requestAnimationFrame(loop);
}
initCRT(); setupTouch(); fit();
{ const sx = CRT.ctx2d; gx.fillStyle = '#000'; gx.fillRect(0, 0, W, H); text(gx, 'CARGANDO...', W / 2, H / 2, '#ffffff', { align:'center' }); present(); }
setTimeout(() => {
  const t0 = performance.now(); buildSprites(); buildBackgrounds(); loadOverrides(); console.info('[kage] sprites horneados en', Math.round(performance.now() - t0), 'ms');
  addEventListener('resize', fit);
  screen.addEventListener('pointerdown', auResume);
  window.KAGE = { get G() { return G; }, get STATE() { return STATE; }, set STATE(v) { STATE = v; ST = 0; }, step(n = 1) { for (let i = 0; i < n; i++) step(); render(); }, tick(n = 1) { for (let i = 0; i < n; i++) step(); }, render, VIN, OPT, SETS, AU, newGame, startSection, buildSong, get SONG() { return SONG; },
    sheet(name) { const s = SETS[name], a = atlas(s, 'base'); const fr = []; for (const [k2, v] of Object.entries(s.anims)) fr.push({ anim:k2, desde:v.s, fotogramas:v.n, ...(v.step ? { ticks_por_fotograma:v.step } : {}), ...(v.loop ? { bucle:true } : {}) }); return { url:a.toDataURL('image/png'), w:s.w, h:s.h, cols:COLS, n:s.n, ax:s.ax, ay:s.ay, anims:fr }; } };
  if (!TEST) requestAnimationFrame(loop); else render();
}, 30);
